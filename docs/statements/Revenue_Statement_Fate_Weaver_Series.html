<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Statement | Pocket FM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f4f4f4;
            color: #000;
            padding: 40px 20px 100px 20px; /* Force bottom space */
        }

        /* Printable Document Container */
        .document-container {
            max-width: 850px;
            margin: 0 auto 60px auto;
            background-color: #ffffff;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            height: 60px;
        }

        .company-title {
            font-size: 18px;
            font-weight: 700;
            text-align: right;
            margin-right: 100px;
        }

        /* Tables Setup */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px;
            vertical-align: top;
        }

        /* Top Info Table */
        .info-table td {
            width: 50%;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 140px 1fr;
            row-gap: 5px;
        }

        .info-label {
            font-weight: 700;
        }

        /* Main Items Table */
        .items-table th {
            font-weight: 700;
            text-align: center;
            background-color: #f9f9f9;
        }

        .items-table td {
            text-align: center;
        }

        .items-table td:nth-child(3) {
            text-align: left; /* Description column */
        }

        /* Totals */
        .total-row {
            font-weight: 700;
            text-align: right;
        }

        .amount-words {
            font-weight: 700;
            background-color: #f9f9f9;
        }

        /* Footer Terms Table */
        .terms-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            row-gap: 8px;
        }
        
        .terms-grid div span {
            font-weight: 700;
        }

        /* Floating Action Button */
        .download-btn {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background-color: #E51A4D;
            color: #ffffff;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(229, 26, 77, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.3s ease;
        }

        .download-btn:hover {
            background-color: #c4123e;
        }

        /* Print Styles */
        @media print {
            body {
                background-color: #ffffff;
                padding: 0;
            }
            .document-container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .download-btn {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Download Button -->
    <button class="download-btn" onclick="window.print()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Download PDF
    </button>

    <div class="document-container">
        
        <!-- Header -->
        <div class="header">
            <img src="https://d2p67bdkbtpxn2.cloudfront.net/dd1600b8e1bde867061ac29dcf9078c72bc533bd.jpg" alt="Pocket FM Logo" class="logo" style="height: 40px; width: 200px; object-fit: cover; object-position: center; border-radius: 4px;">
            <div class="company-title" style="margin-right: 0;">Pocket Entertainment Services LLC</div>
        </div>


        <!-- Performance Metrics Row -->
        <div style="display: flex; gap: 20px; margin-top: 30px; margin-bottom: 20px;">
            <div style="flex: 1; border: 1px solid #000; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background-color: #f9f9f9;">
                <div style="font-size: 14px; font-weight: 700;">TOTAL PLAYS</div>
                <div style="font-size: 18px; font-weight: 700;">1,191</div>
            </div>
            <div style="flex: 1; border: 1px solid #000; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background-color: #f9f9f9;">
                <div style="font-size: 14px; font-weight: 700;">TOTAL LISTENERS</div>
                <div style="font-size: 18px; font-weight: 700;">296</div>
            </div>
        </div>

        <!-- Main Items Table -->
        <div style="width: 100%; border-bottom: 1px solid #ccc; margin-bottom: 30px;">
            <table class="items-table" style="font-size: 14px; margin-bottom: 0;">
                    <thead>
                        <tr>
                            <th colspan="2" style="text-align: left; font-size: 16px; padding: 10px; background-color: #ffffff;">Fate Weaver Series by ReGina Welling</th>
                        </tr>
                    </thead>
                    <tbody>

                        <tr style="background-color: #bfbfbf; font-weight: 700;">
                            <td style="text-align: left; width: 60%; padding: 10px;">Period</td>
                            <td style="text-align: right; width: 40%; padding: 10px;">April-May-June 2026</td>
                        </tr>
                        <tr>
                            <td style="text-align: left; font-weight: 700; padding: 10px;">Revenue Generated (Gross) $</td>
                            <td style="text-align: right; padding: 10px;">87.43</td>
                        </tr>
                        <tr>
                            <td style="text-align: left; padding: 10px;">Revenue Share at 15% $</td>
                            <td style="text-align: right; padding: 10px;">13.12</td>
                        </tr>
                        <tr>
                            <td style="color:transparent; padding: 10px;">-</td>
                            <td></td>
                        </tr>
                        <tr>
                            <td style="text-align: left; padding: 10px;">MG Paid $</td>
                            <td style="text-align: right; padding: 10px;">3,000.00</td>
                        </tr>
                        <tr>
                            <td style="color:transparent; padding: 10px;">-</td>
                            <td></td>
                        </tr>
                        <tr>
                            <td style="text-align: left; padding: 10px;">MG to be recouped $</td>
                            <td style="text-align: right; padding: 10px;">2,986.88</td>
                        </tr>
                        <tr style="background-color: #bfbfbf; font-weight: 700;">
                            <td style="text-align: left; font-size: 15px; padding: 10px;">Final Payout $</td>
                            <td style="text-align: right; font-size: 15px; padding: 10px;">0.00</td>
                        </tr>
        
</tbody>
                </table>
            </div>





    </div>

</body>
</html>
